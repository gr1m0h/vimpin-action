name: vimpin
description: |
  Pin Vim/Neovim plugin specs to explicit commit hashes (lazy.nvim).
  Wraps the gr1m0h/vimpin CLI with a one-line GitHub Actions interface.
author: gr1m0h

branding:
  icon: lock
  color: green

inputs:
  mode:
    description: |
      Operating mode. One of:
        run          - run `vimpin run` (initial pin: field-form -> canonical)
        check        - run `vimpin run --check` (read-only; fail if any file would change)
        verify       - run `vimpin run --verify` (correct annotation to match SHA)
        verify-check - run `vimpin run --verify --check` (read-only verify)
        update       - run `vimpin run --update` (bump to latest tag / branch HEAD)
        no-api       - run `vimpin run --no-api` (offline structural check)
    required: false
    default: verify-check
  paths:
    description: |
      Paths to scan (space-separated). Defaults to vimpin's discovery layout
      (lua/plugins/, lua/config/lazy.lua, init.lua, plugin/).
    required: false
    default: ""
  version:
    description: |
      vimpin CLI version. Accepts a semver tag (e.g. `v0.0.1`), `latest`, or
      `main` for the HEAD of the main branch. Pin to a tag for reproducible
      CI.
    required: false
    default: v0.0.1
  fail-on-diff:
    description: |
      For mode=run or mode=update: fail the job if vimpin produced any
      changes. Useful as a belt-and-braces check alongside mode=check on PRs.
    required: false
    default: "false"
  go-version:
    description: Go toolchain version used to install vimpin.
    required: false
    default: "1.24"

outputs:
  changed:
    description: |
      "true" if the chosen mode wrote (or would write) any file changes,
      "false" otherwise. Useful with mode=run / mode=update to gate a
      follow-up step that opens a PR with the resulting diff.
    value: ${{ steps.vimpin.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ inputs.go-version }}
        cache: false

    - name: Install vimpin
      shell: bash
      env:
        # Passed via env (not template interpolation) to neutralise the
        # GitHub Actions template-injection class.
        VIMPIN_VERSION: ${{ inputs.version }}
      run: |
        set -eu
        case "$VIMPIN_VERSION" in
          latest|main)
            # Rolling pointers (`latest`, `main`) get cached by the Go
            # module proxy for tens of minutes after a push, so a fresh
            # CLI commit on vimpin's main can take a long time to reach
            # CI through proxy.golang.org. Bypass the proxy for these
            # mutable refs; immutable refs (tags, SHAs) keep the proxy
            # for fast, verifiable downloads.
            GOPROXY=direct GOSUMDB=off go install "github.com/gr1m0h/vimpin/cmd/vimpin@${VIMPIN_VERSION}"
            ;;
          v[0-9]*)
            go install "github.com/gr1m0h/vimpin/cmd/vimpin@${VIMPIN_VERSION}"
            ;;
          [0-9a-f][0-9a-f][0-9a-f][0-9a-f]*)
            # commit SHA (at least 4 hex characters)
            go install "github.com/gr1m0h/vimpin/cmd/vimpin@${VIMPIN_VERSION}"
            ;;
          *)
            echo "::error::invalid version: $VIMPIN_VERSION (expected: latest, main, semver tag, or commit SHA)"
            exit 2
            ;;
        esac
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Run vimpin
      id: vimpin
      shell: bash
      env:
        VIMPIN_MODE: ${{ inputs.mode }}
        VIMPIN_PATHS: ${{ inputs.paths }}
        VIMPIN_FAIL_ON_DIFF: ${{ inputs.fail-on-diff }}
      run: |
        set -eu

        # Snapshot the worktree so we can detect changes after a writable mode.
        before=$(git status --porcelain)

        # Expand paths input into an array so spec values are not subject to
        # shell word-splitting beyond whitespace (defence-in-depth against
        # crafted callers).
        read -ra paths_arr <<< "$VIMPIN_PATHS"

        case "$VIMPIN_MODE" in
          run)
            vimpin run "${paths_arr[@]}"
            ;;
          check)
            vimpin run --check "${paths_arr[@]}"
            ;;
          verify)
            vimpin run --verify "${paths_arr[@]}"
            ;;
          verify-check)
            vimpin run --verify --check "${paths_arr[@]}"
            ;;
          update)
            vimpin run --update "${paths_arr[@]}"
            ;;
          no-api)
            vimpin run --no-api "${paths_arr[@]}"
            ;;
          *)
            echo "::error::unknown mode: $VIMPIN_MODE" >&2
            echo "expected one of: run, check, verify, verify-check, update, no-api" >&2
            exit 2
            ;;
        esac

        after=$(git status --porcelain)
        if [ "$before" != "$after" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          if [ "$VIMPIN_FAIL_ON_DIFF" = "true" ]; then
            echo "::error::vimpin produced changes; fail-on-diff is enabled"
            git --no-pager diff
            exit 1
          fi
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi
