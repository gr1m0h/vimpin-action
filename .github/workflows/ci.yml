name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Prepare fixture
        run: |
          mkdir -p fixture/lua/plugins
          cat > fixture/lua/plugins/spec.lua <<'LUA'
          return {
            { "folke/which-key.nvim", tag = "v3.9.0" },
          }
          LUA

      # First pin the fixture, then assert each read-only mode passes.
      - uses: ./
        with:
          mode: run
          paths: fixture/lua/plugins
      - uses: ./
        with:
          mode: no-api
          paths: fixture/lua/plugins
      - uses: ./
        with:
          mode: verify-check
          paths: fixture/lua/plugins

  lint-action-yml:
    name: lint action.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # Install the actionlint binary via its pinned bootstrap script instead
      # of a floating third-party action (rhysd/actionlint@main), matching the
      # gr1m0h/.github actions-pin-lint reusable workflow.
      - name: install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
      - name: actionlint
        run: ./actionlint -color
