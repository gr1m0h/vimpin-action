name: tagpr
# Maintains a release PR on every push to main. Merging it cuts the next
# semver tag and publishes a GitHub Release with auto-generated notes
# (release = true in .tagpr). This is a composite action, so there is
# nothing to build or upload — consumers pin a released version, e.g.
# `uses: gr1m0h/vimpin-action@v0.1.0` (or a commit SHA).
#
# tagpr creates the vX.Y.Z tag through the GitHub API, so the tag is
# web-flow signed and satisfies the repo's tag-protection ruleset
# (required_signatures). The workflow uses GITHUB_TOKEN end-to-end.
#
# Bump kind is controlled by labels on merged PRs:
#   tagpr:minor / tagpr:major (default: patch).

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tagpr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: Songmu/tagpr@967f2ab22be958948fb5bd439bfa3d404dd9dee8 # v1.21.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
